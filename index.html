<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonBet - Color Prediction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --red: #ef4444;
            --green: #10b981;
            --violet: #8b5cf6;
            --primary: #3b82f6;
            --glow: rgba(59, 130, 246, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #334155; }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary); text-shadow: 0 0 10px var(--glow); }
        .user-info { display: flex; gap: 15px; align-items: center; }
        .balance-badge { background: #0f172a; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--green); color: var(--green); font-weight: 600; font-family: 'Space Mono', monospace; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { box-shadow: 0 0 15px var(--glow); transform: translateY(-2px); }
        button.outline { background: transparent; border: 1px solid var(--primary); }

        /* Main Game Area */
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; flex: 1; }
        
        .timer-box { text-align: center; background: var(--panel); padding: 30px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .round-id { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        .timer { font-size: 60px; font-family: 'Space Mono', monospace; font-weight: 700; color: white; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .timer.red { color: var(--red); text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

        /* Colors */
        .color-grid { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .color-btn { flex: 1; padding: 20px; border-radius: 12px; font-size: 18px; font-weight: 700; text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .color-btn.red { background: rgba(239, 68, 68, 0.1); color: var(--red); border-color: rgba(239, 68, 68, 0.5); }
        .color-btn.green { background: rgba(16, 185, 129, 0.1); color: var(--green); border-color: rgba(16, 185, 129, 0.5); }
        .color-btn.violet { background: rgba(139, 92, 246, 0.1); color: var(--violet); border-color: rgba(139, 92, 246, 0.5); }
        .color-btn:hover, .color-btn.selected { transform: scale(1.05); filter: brightness(1.2); }
        .color-btn.red.selected { box-shadow: 0 0 20px rgba(239,68,68,0.4); background: var(--red); color: white; }
        .color-btn.green.selected { box-shadow: 0 0 20px rgba(16,185,129,0.4); background: var(--green); color: white; }
        .color-btn.violet.selected { box-shadow: 0 0 20px rgba(139,92,246,0.4); background: var(--violet); color: white; }

        /* Betting Controls */
        .bet-controls { background: var(--panel); padding: 20px; border-radius: 15px; display: flex; gap: 15px; border: 1px solid #334155; }
        input[type="number"], input[type="text"], input[type="email"], input[type="password"] { flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; font-family: 'Space Mono', monospace; }
        input:focus { border-color: var(--primary); }
        .bet-btn { width: 150px; font-size: 18px; }

        /* History */
        .history { margin-top: 30px; background: var(--panel); padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        .history-dots { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .dot { width: 25px; height: 25px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        .dot.red { background: var(--red); }
        .dot.green { background: var(--green); }
        .dot.violet { background: var(--violet); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--panel); padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid #334155; position: relative; }
        .modal h2 { margin-bottom: 20px; text-align: center; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: transparent; color: #94a3b8; font-size: 20px; padding: 0; }
        .modal-form { display: flex; flex-direction: column; gap: 15px; }

        /* Payment UI */
        .upi-apps { display: flex; gap: 10px; margin-bottom: 15px; }
        .upi-apps button { flex: 1; background: #0f172a; border: 1px solid #334155; }
        .qr-box { text-align: center; margin: 20px 0; background: white; padding: 15px; border-radius: 10px; display: none; }
        .qr-box img { width: 200px; height: 200px; }

        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 15px 25px; border-radius: 8px; display: none; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s;}
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">NEONBET</div>
        <div class="user-info" id="loggedOutView">
            <button class="outline" onclick="openModal('authModal')">Login / Register</button>
        </div>
        <div class="user-info" id="loggedInView" style="display: none;">
            <div class="balance-badge">₹<span id="userBalance">0.00</span></div>
            <button onclick="openModal('depositModal')">Deposit</button>
            <button class="outline" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Main Game -->
    <div class="container">
        <div class="timer-box">
            <div class="round-id">Period: <span id="periodId">Loading...</span></div>
            <div class="timer" id="timerDisplay">00:60</div>
            <p id="gameStatus" style="margin-top: 10px; color: #94a3b8;">Betting is OPEN</p>
        </div>

        <div class="color-grid">
            <div class="color-btn green" onclick="selectColor('green')">Green (2x)</div>
            <div class="color-btn violet" onclick="selectColor('violet')">Violet (4x)</div>
            <div class="color-btn red" onclick="selectColor('red')">Red (2x)</div>
        </div>

        <div class="bet-controls">
            <input type="number" id="betAmount" placeholder="Enter amount (Min ₹10)" min="10">
            <button class="bet-btn" id="placeBetBtn" onclick="placeBet()">Place Bet</button>
        </div>

        <div class="history">
            <h3>Recent Results</h3>
            <div class="history-dots" id="historyDots">
                <!-- History populated via JS -->
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('authModal')">✖</button>
            <h2>Welcome</h2>
            <div class="modal-form">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()">Login</button>
                <button class="outline" onclick="register()">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Deposit Modal (UPI / GPay) -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal">
            <button class="close-btn" onclick="closeModal('depositModal')">✖</button>
            <h2>Add Funds</h2>
            <div class="modal-form">
                <input type="number" id="depAmount" placeholder="Amount to deposit (₹)">
                
                <div class="upi-apps">
                    <button onclick="generatePayment('gpay')">GPay</button>
                    <button onclick="generatePayment('phonepe')">PhonePe</button>
                    <button onclick="generatePayment('upi')">Any UPI</button>
                </div>

                <div class="qr-box" id="qrBox">
                    <img id="qrImage" src="" alt="UPI QR Code">
                    <p style="color: black; margin-top: 10px; font-size: 14px;">Scan & Pay ₹<span id="qrAmt"></span></p>
                    <a id="payLinkBtn" href="#" style="display:block; margin-top:10px; background:#3b82f6; color:white; text-decoration:none; padding:10px; border-radius:5px;">Open Payment App</a>
                </div>

                <input type="text" id="utrNumber" placeholder="Enter 12-digit UTR / Ref No.">
                <button onclick="submitDeposit()">Verify & Add Funds</button>
                <p style="font-size: 12px; color: #94a3b8; text-align: center;">Note: Funds are credited after UTR verification.</p>
            </div>
        </div>
    </div>

    <div id="toast">Message here</div>

    <!-- FIREBASE SDK (Module Type) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // ⚠️ REPLACE WITH YOUR FIREBASE CONFIG
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyA22T0xFbjVQKRYkn9d2xtKCaXp3UjlR3M",
  authDomain: "game-base-78336.firebaseapp.com",
  projectId: "game-base-78336",
  storageBucket: "game-base-78336.firebasestorage.app",
  messagingSenderId: "225228229264",
  appId: "1:225228229264:web:1464133ce1d161214a6615",
  measurementId: "G-KRSR9EV632"
};
        };

        // ==========================================
        // ⚠️ REPLACE WITH YOUR UPI ID
        // ==========================================
        const MERCHANT_UPI_ID = "yourname@okhdfcbank"; 
        const MERCHANT_NAME = "NeonBet";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State
        window.currentUser = null;
        window.selectedColor = null;
        window.currentPeriod = Math.floor(Date.now() / 60000); // 1 minute periods
        window.timeLeft = 60;
        window.betPlaced = false;
        window.currentBet = { amount: 0, color: null };

        // --- AUTHENTICATION FUNCTIONS ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('loggedInView').style.display = 'flex';
                document.getElementById('loggedOutView').style.display = 'none';
                closeModal('authModal');
                fetchBalance();
            } else {
                window.currentUser = null;
                document.getElementById('loggedInView').style.display = 'none';
                document.getElementById('loggedOutView').style.display = 'flex';
                document.getElementById('userBalance').innerText = "0.00";
            }
        });

        window.register = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try {
                const cred = await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db, "users", cred.user.uid), { balance: 100, email: e }); // 100 Bonus
                showToast("Account Created! ₹100 Bonus Added.");
            } catch (err) { showToast(err.message); }
        };

        window.login = async () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            try { await signInWithEmailAndPassword(auth, e, p); showToast("Logged In!"); } 
            catch (err) { showToast(err.message); }
        };

        window.logout = () => signOut(auth);

        async function fetchBalance() {
            if(!window.currentUser) return;
            const d = await getDoc(doc(db, "users", window.currentUser.uid));
            if(d.exists()) {
                document.getElementById('userBalance').innerText = d.data().balance.toFixed(2);
            }
        }

        // --- GAME ENGINE ---
        setInterval(() => {
            const now = new Date();
            const seconds = now.getSeconds();
            window.timeLeft = 60 - seconds;
            window.currentPeriod = Math.floor(now.getTime() / 60000);
            
            document.getElementById('periodId').innerText = window.currentPeriod;
            
            const tDisplay = document.getElementById('timerDisplay');
            tDisplay.innerText = `00:${window.timeLeft < 10 ? '0'+window.timeLeft : window.timeLeft}`;

            if (window.timeLeft <= 10) {
                tDisplay.classList.add('red');
                document.getElementById('gameStatus').innerText = "Betting CLOSED. Drawing Result...";
                document.getElementById('placeBetBtn').disabled = true;
                document.getElementById('placeBetBtn').style.opacity = 0.5;
            } else {
                tDisplay.classList.remove('red');
                document.getElementById('gameStatus').innerText = "Betting is OPEN";
                document.getElementById('placeBetBtn').disabled = false;
                document.getElementById('placeBetBtn').style.opacity = 1;
            }

            // Resolve round at 0
            if (window.timeLeft === 60 || window.timeLeft === 0) {
                if(!window.resolving) {
                    window.resolving = true;
                    resolveGame();
                    setTimeout(() => window.resolving = false, 2000);
                }
            }
        }, 1000);

        window.selectColor = (color) => {
            if(window.timeLeft <= 10) return showToast("Betting closed for this round!");
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector(`.color-btn.${color}`).classList.add('selected');
            window.selectedColor = color;
        };

        window.placeBet = async () => {
            if (!window.currentUser) return openModal('authModal');
            if (!window.selectedColor) return showToast("Select a color first!");
            
            const amt = parseInt(document.getElementById('betAmount').value);
            if (isNaN(amt) || amt < 10) return showToast("Minimum bet is ₹10");

            const userRef = doc(db, "users", window.currentUser.uid);
            const userSnap = await getDoc(userRef);
            
            if (userSnap.data().balance < amt) return showToast("Insufficient Balance!");

            // Deduct Balance
            await updateDoc(userRef, { balance: increment(-amt) });
            fetchBalance();

            window.betPlaced = true;
            window.currentBet = { amount: amt, color: window.selectedColor };
            showToast(`Bet placed: ₹${amt} on ${window.selectedColor}`);
            
            // Reset UI
            document.getElementById('betAmount').value = '';
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            window.selectedColor = null;
        };

        async function resolveGame() {
            // Pick a random winner
            const colors = ['red', 'green', 'violet'];
            // 45% Red, 45% Green, 10% Violet
            const rand = Math.random();
            let winner = rand < 0.45 ? 'red' : (rand < 0.90 ? 'green' : 'violet');

            addHistoryDot(winner);

            if (window.betPlaced && window.currentUser) {
                if (window.currentBet.color === winner) {
                    // Win Logic
                    const multiplier = winner === 'violet' ? 4 : 2;
                    const winAmount = window.currentBet.amount * multiplier;
                    await updateDoc(doc(db, "users", window.currentUser.uid), { balance: increment(winAmount) });
                    showToast(`🎉 You Won ₹${winAmount}! Result was ${winner}.`);
                    fetchBalance();
                } else {
                    showToast(`❌ You Lost. Result was ${winner}.`);
                }
            } else if(window.currentUser) {
                showToast(`Round Result: ${winner}`);
            }

            window.betPlaced = false;
            window.currentBet = { amount: 0, color: null };
        }

        function addHistoryDot(color) {
            const container = document.getElementById('historyDots');
            const dot = document.createElement('div');
            dot.className = `dot ${color}`;
            container.prepend(dot);
            if(container.children.length > 15) container.lastChild.remove();
        }

        // --- PAYMENT ENGINE (GPay / PhonePe / UPI) ---
        window.generatePayment = (appType) => {
            const amt = document.getElementById('depAmount').value;
            if (!amt || amt < 100) return showToast("Minimum deposit is ₹100");

            const txnRef = "TXN" + Date.now();
            const note = encodeURI("NeonBet Deposit");
            const upiString = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURI(MERCHANT_NAME)}&am=${amt}&cu=INR&tn=${note}&tr=${txnRef}`;
            
            let deepLink = upiString;
            if(appType === 'gpay') deepLink = `tez://upi/pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURI(MERCHANT_NAME)}&am=${amt}&cu=INR&tn=${note}&tr=${txnRef}`;
            if(appType === 'phonepe') deepLink = `phonepe://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURI(MERCHANT_NAME)}&am=${amt}&cu=INR&tn=${note}&tr=${txnRef}`;

            // Generate QR Code via Google Charts API
            const qrUrl = `https://chart.googleapis.com/chart?cht=qr&chs=200x200&choe=UTF-8&chl=${encodeURIComponent(upiString)}`;
            
            document.getElementById('qrImage').src = qrUrl;
            document.getElementById('qrAmt').innerText = amt;
            document.getElementById('payLinkBtn').href = deepLink;
            document.getElementById('qrBox').style.display = "block";
        };

        window.submitDeposit = async () => {
            const utr = document.getElementById('utrNumber').value;
            const amt = parseInt(document.getElementById('depAmount').value);
            
            if(utr.length < 12) return showToast("Invalid UTR. Must be 12 digits.");
            if(!amt || amt < 100) return showToast("Invalid Amount.");

            showToast("Verifying Transaction...");
            
            // ⚠️ IN PRODUCTION: Send UTR to your backend to verify via Cashfree/Razorpay APIs.
            // For this frontend build, we will simulate successful verification after 2 seconds.
            setTimeout(async () => {
                await updateDoc(doc(db, "users", window.currentUser.uid), { balance: increment(amt) });
                fetchBalance();
                showToast(`✅ ₹${amt} Successfully Added to Wallet!`);
                closeModal('depositModal');
                
                // Reset form
                document.getElementById('qrBox').style.display = "none";
                document.getElementById('utrNumber').value = "";
                document.getElementById('depAmount').value = "";
            }, 2000);
        };

        // --- UI HELPERS ---
        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        };

        // Populate initial history dummy data
        for(let i=0; i<10; i++) {
            const c = ['red', 'green', 'violet'][Math.floor(Math.random()*3)];
            addHistoryDot(c);
        }
    </script>
</body>
</html>
