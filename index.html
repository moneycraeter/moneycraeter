<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Prediction Game - Full Single File App</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QRCode JS Library for UPI / GPay QR Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-violet: #8b5cf6;
            --accent-gold: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
        }

        .balance-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid #4338ca;
        }

        .balance-title {
            font-size: 0.85rem;
            color: #c7d2fe;
        }

        .balance-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #1e293b;
            color: #fff;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            margin-top: 8px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-violet { background: var(--accent-violet); color: white; }
        .btn-gold { background: var(--accent-gold); color: #000; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        .btn-group .btn {
            flex: 1;
        }

        .timer-box {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--accent-gold);
        }

        .hidden { display: none !important; }

        .qr-wrapper {
            text-align: center;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            display: inline-block;
        }

        .gpay-btn {
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }

        .gpay-btn img {
            height: 20px;
        }

        .tab-menu {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 600;
        }

        .tab-item.active {
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .badge-green { background: var(--accent-green); color: white; }
        .badge-red { background: var(--accent-red); color: white; }
        .badge-violet { background: var(--accent-violet); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-gamepad"></i> Color Pro 2026</h1>
        <p>Win Rewards with Prediction</p>
    </div>

    <!-- AUTHENTICATION SECTION -->
    <div id="auth-section" class="card">
        <h3 style="text-align: center; margin-bottom: 12px;">Login or Register</h3>
        <input type="email" id="auth-email" placeholder="Enter Email ID">
        <input type="password" id="auth-password" placeholder="Enter Password">
        <button class="btn btn-primary" onclick="handleLogin()">Login</button>
        <button class="btn btn-success" onclick="handleSignUp()">Create Account</button>
        <p id="auth-msg" style="color: var(--accent-gold); font-size: 0.8rem; margin-top: 10px; text-align: center;"></p>
    </div>

    <!-- MAIN GAME PANEL -->
    <div id="game-panel" class="hidden">
        <!-- Balance Header -->
        <div class="balance-board">
            <div>
                <div class="balance-title">Wallet Balance</div>
                <div class="balance-value">₹<span id="user-balance">500.00</span></div>
            </div>
            <button class="btn btn-gold" style="width: auto; padding: 8px 16px;" onclick="showTab('deposit')">+ Deposit</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-menu">
            <div class="tab-item active" onclick="showTab('game')">Game</div>
            <div class="tab-item" onclick="showTab('deposit')">Deposit (UPI)</div>
            <div class="tab-item" onclick="showTab('history')">History</div>
        </div>

        <!-- TAB 1: GAME SECTION -->
        <div id="tab-game">
            <div class="card">
                <div class="timer-box">
                    Next Round In: <span id="countdown">30</span>s
                </div>

                <label style="font-size: 0.85rem; color: var(--text-muted);">Select Amount (₹):</label>
                <input type="number" id="bet-amount" value="50" min="10" step="10">

                <div class="btn-group">
                    <button class="btn btn-success" onclick="placeBet('Green')">Green (2x)</button>
                    <button class="btn btn-violet" onclick="placeBet('Violet')">Violet (4.5x)</button>
                    <button class="btn btn-danger" onclick="placeBet('Red')">Red (2x)</button>
                </div>

                <p id="game-result-msg" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
            </div>
        </div>

        <!-- TAB 2: DEPOSIT (UPI / GPAY) SECTION -->
        <div id="tab-deposit" class="hidden">
            <div class="card">
                <h4 style="margin-bottom: 10px;"><i class="fa-solid fa-qrcode"></i> Instant UPI / GPay Recharge</h4>
                <label style="font-size: 0.85rem; color: var(--text-muted);">Enter Amount (Min ₹100):</label>
                <input type="number" id="deposit-amount" value="100" min="100">

                <button class="btn btn-gold" onclick="generateUPIQR()"><i class="fa-solid fa-qrcode"></i> Generate QR Code</button>
                <button class="btn gpay-btn" onclick="payViaGPayDirect()" style="margin-top: 8px;">
                    <i class="fa-brands fa-google-pay" style="font-size: 1.5rem; color: #4285F4;"></i> Pay with GPay / UPI App
                </button>

                <div id="qr-display-area" class="hidden" style="text-align: center; margin-top: 15px;">
                    <div style="background: white; padding: 10px; display: inline-block; border-radius: 8px;">
                        <div id="qrcode"></div>
                    </div>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin: 8px 0;">Scan QR with GPay, PhonePe, Paytm or Amazon Pay</p>
                    
                    <input type="text" id="utr-ref-input" placeholder="Enter 12-Digit UTR / Ref No.">
                    <button class="btn btn-success" onclick="submitUPIPayment()">Submit Payment Proof</button>
                </div>
            </div>
        </div>

        <!-- TAB 3: HISTORY SECTION -->
        <div id="tab-history" class="hidden">
            <div class="card">
                <h4 style="margin-bottom: 10px;"><i class="fa-solid fa-clock-rotate-left"></i> Transaction & Bet History</h4>
                <div id="history-list">
                    <div class="history-item">
                        <span>Bet: <span class="badge badge-green">Green</span> (₹50)</span>
                        <span style="color: var(--accent-green);">+₹100 (Won)</span>
                    </div>
                    <div class="history-item">
                        <span>Bet: <span class="badge badge-red">Red</span> (₹100)</span>
                        <span style="color: var(--accent-red);">-₹100 (Lost)</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn" style="background: #334155; color: white; margin-top: 15px;" onclick="handleLogout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </div>
</div>

<script>
    // ==========================================
    // 1. SUPABASE INITIALIZATION
    // ==========================================
    const SUPABASE_URL = "https://rdvkptehpucheohkkxsm.supabase.co"; // Replace with your Supabase URL
    const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdmtwdGVocHVjaGVvaGtreHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Njg4MDcsImV4cCI6MjEwMzA0NDgwN30.R9YEELEzIw-hRuUFvp1JKR9n7f8psd2-3uR3z0liZUg";                    // Replace with your Supabase Anon Key
    
    // Initialize Supabase Client
    let supabase = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL !== "https://your-supabase-project.supabase.co") {
        supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let userBalance = 500.00;
    let timerVal = 30;

    // Timer Loop
    setInterval(() => {
        timerVal--;
        if (timerVal <= 0) {
            timerVal = 30;
        }
        document.getElementById('countdown').innerText = timerVal;
    }, 1000);

    // ==========================================
    // 2. AUTHENTICATION LOGIC
    // ==========================================
    async function handleSignUp() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const msg = document.getElementById('auth-msg');

        if(!email || !password) {
            msg.innerText = "Please enter both Email and Password!";
            return;
        }

        if(supabase) {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                msg.innerText = error.message;
            } else {
                msg.innerText = "Account registered successfully! You can now login.";
            }
        } else {
            // Local fallback simulation
            msg.innerText = "Account Created (Demo Mode). Please Login!";
        }
    }

    async function handleLogin() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const msg = document.getElementById('auth-msg');

        if(!email || !password) {
            msg.innerText = "Please enter both Email and Password!";
            return;
        }

        if(supabase) {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                msg.innerText = error.message;
            } else {
                showGamePanel();
            }
        } else {
            // Local fallback simulation
            showGamePanel();
        }
    }

    function showGamePanel() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('game-panel').classList.remove('hidden');
    }

    function handleLogout() {
        if(supabase) supabase.auth.signOut();
        document.getElementById('game-panel').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
    }

    // ==========================================
    // 3. GAME LOGIC
    // ==========================================
    function placeBet(selectedColor) {
        const betAmt = parseFloat(document.getElementById('bet-amount').value);
        const resultMsg = document.getElementById('game-result-msg');

        if (isNaN(betAmt) || betAmt <= 0) {
            alert("Invalid Bet Amount!");
            return;
        }

        if (betAmt > userBalance) {
            alert("Insufficient Wallet Balance! Please Recharge.");
            return;
        }

        // Deduct Bet Amount
        userBalance -= betAmt;
        updateBalanceUI();

        resultMsg.style.color = "var(--accent-gold)";
        resultMsg.innerText = "Calculating Result...";

        setTimeout(() => {
            // Colors simulation
            const colors = ['Green', 'Red', 'Violet'];
            const winningColor = colors[Math.floor(Math.random() * colors.length)];

            if (selectedColor === winningColor) {
                let multiplier = (winningColor === 'Violet') ? 4.5 : 2;
                let winnings = betAmt * multiplier;
                userBalance += winnings;
                resultMsg.style.color = "var(--accent-green)";
                resultMsg.innerText = `Result: ${winningColor}! You Won ₹${winnings.toFixed(2)}`;
                addHistoryItem(selectedColor, betAmt, winnings, true);
            } else {
                resultMsg.style.color = "var(--accent-red)";
                resultMsg.innerText = `Result: ${winningColor}! You Lost ₹${betAmt.toFixed(2)}`;
                addHistoryItem(selectedColor, betAmt, 0, false);
            }
            updateBalanceUI();
        }, 1200);
    }

    function updateBalanceUI() {
        document.getElementById('user-balance').innerText = userBalance.toFixed(2);
    }

    // ==========================================
    // 4. UPI & GPAY PAYMENT INTEGRATION
    // ==========================================
    const MERCHANT_UPI_ID = "r-vallarasu@ptyes"; // Replace with your actual merchant/Personal UPI ID
    const MERCHANT_NAME = "ColorPro Gaming";

    function generateUPIQR() {
        const amount = document.getElementById('deposit-amount').value;
        if (!amount || amount < 100) {
            alert("Minimum deposit amount is ₹100");
            return;
        }

        // Build Standard UPI Protocol URI
        const upiUri = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${amount}&cu=INR&tn=WalletRecharge`;

        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
            text: upiUri,
            width: 160,
            height: 160
        });

        document.getElementById('qr-display-area').classList.remove('hidden');
    }

    function payViaGPayDirect() {
        const amount = document.getElementById('deposit-amount').value;
        if (!amount || amount < 100) {
            alert("Minimum deposit amount is ₹100");
            return;
        }

        const upiUri = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURIComponent(MERCHANT_NAME)}&am=${amount}&cu=INR&tn=WalletRecharge`;
        
        // Triggers mobile UPI apps directly (GPay/PhonePe/Paytm)
        window.location.href = upiUri;
        document.getElementById('qr-display-area').classList.remove('hidden');
    }

    function submitUPIPayment() {
        const utr = document.getElementById('utr-ref-input').value;
        const amount = parseFloat(document.getElementById('deposit-amount').value);

        if (!utr || utr.length < 6) {
            alert("Please enter a valid 12-digit UTR/Reference Number from GPay!");
            return;
        }

        alert("Payment Proof Submitted! Funds will be added after instant verification.");
        
        // Auto-credit for demo purpose
        userBalance += amount;
        updateBalanceUI();
        document.getElementById('qr-display-area').classList.add('hidden');
        document.getElementById('utr-ref-input').value = "";
    }

    // Navigation logic
    function showTab(tabName) {
        document.getElementById('tab-game').classList.add('hidden');
        document.getElementById('tab-deposit').classList.add('hidden');
        document.getElementById('tab-history').classList.add('hidden');

        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach(tab => tab.classList.remove('active'));

        if (tabName === 'game') {
            document.getElementById('tab-game').classList.remove('hidden');
            tabs[0].classList.add('active');
        } else if (tabName === 'deposit') {
            document.getElementById('tab-deposit').classList.remove('hidden');
            tabs[1].classList.add('active');
        } else if (tabName === 'history') {
            document.getElementById('tab-history').classList.remove('hidden');
            tabs[2].classList.add('active');
        }
    }

    function addHistoryItem(color, bet, win, isWin) {
        const historyList = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = 'history-item';
        
        let colorClass = color === 'Green' ? 'badge-green' : (color === 'Red' ? 'badge-red' : 'badge-violet');
        
        item.innerHTML = `
            <span>Bet: <span class="badge ${colorClass}">${color}</span> (₹${bet})</span>
            <span style="color: ${isWin ? 'var(--accent-green)' : 'var(--accent-red)'};">
                ${isWin ? '+₹' + win.toFixed(2) + ' (Won)' : '-₹' + bet.toFixed(2) + ' (Lost)'}
            </span>
        `;
        historyList.prepend(item);
    }
</script>

</body>
</html>
